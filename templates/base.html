{% load static %}
<!DOCTYPE html>
<html lang="en" class="has-navbar-fixed-top">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Bangazon Admin</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css">
        <style>[hidden] { display: none !important; }</style>
    </head>
    <body>
        <nav class="navbar mb-3 is-warning px-5 is-fixed-top is-top" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <a class="navbar-item" href="/">
                    <img src="{% static 'images/logo.png' %}" alt="Logo" style="width: 4rem; height: 4rem; max-height: 4rem;" class="relative" />
                    <h1 class="title">Bangazon Admin</h1>
                </a>
            </div>
            <div class="navbar-menu" ref={navbar}>
                <div class="navbar-start">
                    <a class="navbar-item" href="{% url 'reports' %}">Reports</a>
                </div>
                <div class="navbar-end">
            </div>
        </nav>
        {% block content %}
        {% endblock %}

    </body>
</html>
